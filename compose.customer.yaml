# Combine with compose.independent.yaml for a licensed customer installation.
services:
  iam:
    build:
      target: customer
    environment:
      NODE_ENV: production
      NEOLA_CUSTOMER_DEPLOYMENT: 'true'
      CONTROL_PLANE_MODE: subscription
      CONTROL_LICENSE_PUBLIC_KEY_FILE: /run/secrets/provider-license-public.pem
    volumes:
      - type: bind
        source: ${CONTROL_LICENSE_PUBLIC_KEY_HOST_FILE:?Set the provider PUBLIC key path in .env.deploy}
        target: /run/secrets/provider-license-public.pem
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
